<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7f3">
  <title>이번 주 나의 일정 | 1안</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1d2824;
      --muted: #66706c;
      --line: #d8dfda;
      --paper: #ffffff;
      --wash: #f4f7f3;
      --green: #25684d;
      --green-soft: #e2f0e8;
      --blue: #285d87;
      --blue-soft: #e6f0f7;
      --gold: #8a641e;
      --gold-soft: #f6edda;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--wash);
      color: var(--ink);
      font-family: "Pretendard", "Noto Sans KR", "Malgun Gothic", sans-serif;
      line-height: 1.55;
      letter-spacing: 0;
    }

    button, a, input, select { font: inherit; }

    .topbar {
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
    }

    .topbar-inner,
    main {
      width: min(920px, calc(100% - 32px));
      margin: 0 auto;
    }

    .topbar-inner {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .back {
      color: var(--ink);
      text-decoration: none;
      font-weight: 700;
    }

    .top-title {
      color: var(--muted);
      font-size: 14px;
      white-space: nowrap;
    }

    main { padding: 56px 0 72px; }

    .intro {
      padding-bottom: 34px;
      border-bottom: 1px solid var(--line);
    }

    .kicker {
      margin: 0 0 12px;
      color: var(--green);
      font-size: 14px;
      font-weight: 800;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 7vw, 54px);
      line-height: 1.16;
      letter-spacing: 0;
    }

    .lead {
      max-width: 620px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 17px;
    }

    .schedule-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin: 34px 0 18px;
    }

    .add-form {
      display: grid;
      grid-template-columns: 150px 1fr 150px auto;
      align-items: end;
      gap: 12px;
      margin: 28px 0 12px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      min-height: 42px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
    }

    .add-button {
      min-height: 42px;
      padding: 8px 18px;
      border: 0;
      border-radius: 6px;
      background: var(--green);
      color: #fff;
      cursor: pointer;
      font-weight: 800;
      white-space: nowrap;
    }

    h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }

    .filters {
      display: inline-flex;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
    }

    .filter {
      min-width: 60px;
      min-height: 36px;
      padding: 6px 12px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }

    .filter[aria-pressed="true"] {
      background: var(--ink);
      color: #fff;
    }

    .schedule {
      display: grid;
      gap: 12px;
    }

    .item {
      display: grid;
      grid-template-columns: 82px 1fr auto;
      align-items: center;
      gap: 20px;
      min-height: 112px;
      padding: 20px 22px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--paper);
    }

    .item[hidden] { display: none; }

    .date {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .date strong {
      display: block;
      color: var(--ink);
      font-size: 25px;
      line-height: 1.2;
    }

    .details h3 {
      margin: 0 0 4px;
      font-size: 18px;
      letter-spacing: 0;
    }

    .details p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .tag {
      min-width: 54px;
      padding: 5px 10px;
      border-radius: 999px;
      text-align: center;
      font-size: 13px;
      font-weight: 800;
    }

    .class .tag { background: var(--blue-soft); color: var(--blue); }
    .personal .tag { background: var(--gold-soft); color: var(--gold); }
    .coding .tag { background: var(--green-soft); color: var(--green); }

    .note {
      margin: 22px 0 0;
      padding: 16px 18px;
      border-left: 4px solid var(--green);
      background: var(--green-soft);
      color: #315846;
      font-size: 14px;
    }

    @media (max-width: 640px) {
      .topbar-inner,
      main { width: min(100% - 24px, 920px); }
      main { padding-top: 38px; }
      .top-title { display: none; }
      .schedule-head { align-items: stretch; flex-direction: column; }
      .filters { align-self: flex-start; }
      .add-form { grid-template-columns: 1fr; }
      .item {
        grid-template-columns: 62px 1fr;
        gap: 14px;
        padding: 18px;
      }
      .tag { grid-column: 2; justify-self: start; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="back" href="../" aria-label="세 가지 안 비교 화면으로 돌아가기">← 비교 화면</a>
      <span class="top-title">바이브코딩 난이도별 운영안</span>
    </div>
  </header>

  <main>
    <section class="intro">
      <p class="kicker">1안 · 초급 체험형</p>
      <h1>이번 주 나의 일정</h1>
      <p class="lead">수업과 개인 일정을 한눈에 확인할 수 있도록 한 페이지에 정리했습니다.</p>
    </section>

    <section aria-labelledby="schedule-title">
      <form class="add-form" id="schedule-form">
        <div class="field">
          <label for="schedule-date">날짜</label>
          <input id="schedule-date" name="date" type="date" required>
        </div>
        <div class="field">
          <label for="schedule-name">일정</label>
          <input id="schedule-name" name="name" type="text" maxlength="40" placeholder="일정 이름" required>
        </div>
        <div class="field">
          <label for="schedule-category">분류</label>
          <select id="schedule-category" name="category">
            <option value="class">수업</option>
            <option value="personal">개인</option>
          </select>
        </div>
        <button class="add-button" type="submit">일정 추가</button>
      </form>

      <div class="schedule-head">
        <h2 id="schedule-title">7월 셋째 주</h2>
        <div class="filters" aria-label="일정 분류">
          <button class="filter" type="button" data-filter="all" aria-pressed="true">전체</button>
          <button class="filter" type="button" data-filter="class" aria-pressed="false">수업</button>
          <button class="filter" type="button" data-filter="personal" aria-pressed="false">개인</button>
        </div>
      </div>

      <div class="schedule" aria-live="polite">
        <article class="item class" data-category="class">
          <div class="date"><strong>15</strong>월요일</div>
          <div class="details">
            <h3>과학 프로젝트 개요 정리</h3>
            <p>16:00 · 컴퓨터실</p>
          </div>
          <span class="tag">수업</span>
        </article>

        <article class="item personal" data-category="personal">
          <div class="date"><strong>17</strong>수요일</div>
          <div class="details">
            <h3>도서관 책 반납</h3>
            <p>18:00 · 이음터 도서관</p>
          </div>
          <span class="tag">개인</span>
        </article>

        <article class="item class coding" data-category="class">
          <div class="date"><strong>20</strong>토요일</div>
          <div class="details">
            <h3>바이브코딩 수업</h3>
            <p>13:00 · 컴퓨터실</p>
          </div>
          <span class="tag">수업</span>
        </article>

        <article class="item personal" data-category="personal">
          <div class="date"><strong>21</strong>일요일</div>
          <div class="details">
            <h3>다음 주 준비물 확인</h3>
            <p>20:00 · 집</p>
          </div>
          <span class="tag">개인</span>
        </article>
      </div>

      <p class="note">이번 주에는 토요일 수업 전 발표할 내용을 한 번 더 확인합니다.</p>
    </section>
  </main>

  <script>
    const buttons = document.querySelectorAll("[data-filter]");
    const scheduleForm = document.querySelector("#schedule-form");
    const schedule = document.querySelector(".schedule");
    let selectedFilter = "all";

    function applyFilter() {
      document.querySelectorAll("[data-category]").forEach((item) => {
        item.hidden = selectedFilter !== "all" && item.dataset.category !== selectedFilter;
      });
    }

    buttons.forEach((button) => {
      button.addEventListener("click", () => {
        selectedFilter = button.dataset.filter;
        buttons.forEach((current) => {
          current.setAttribute("aria-pressed", String(current === button));
        });
        applyFilter();
      });
    });

    scheduleForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const data = new FormData(scheduleForm);
      const date = new Date(`${data.get("date")}T00:00:00`);
      const category = String(data.get("category"));
      const label = category === "class" ? "수업" : "개인";
      const item = document.createElement("article");
      item.className = `item ${category}`;
      item.dataset.category = category;

      const dateBox = document.createElement("div");
      dateBox.className = "date";
      const day = document.createElement("strong");
      day.textContent = String(date.getDate());
      dateBox.append(day, new Intl.DateTimeFormat("ko-KR", { weekday: "long" }).format(date));

      const details = document.createElement("div");
      details.className = "details";
      const title = document.createElement("h3");
      title.textContent = String(data.get("name")).trim();
      const description = document.createElement("p");
      description.textContent = "새로 추가한 일정";
      details.append(title, description);

      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = label;
      item.append(dateBox, details, tag);
      schedule.prepend(item);

      scheduleForm.reset();
      applyFilter();
    });
  </script>
</body>
</html>
